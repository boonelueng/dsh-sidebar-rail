<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-sidebar-rail 拖拽回归台</title>
<style>
  /* 复刻 DSH 侧边栏外壳的关键布局（只保留影响几何的部分，不复制视觉细节） */
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; background: #f5f5f5; }
  #col { width: 280px; height: 100%; background: #fbfbfb; border-right: .5px solid #e3e3e3; }
  #root { display: flex; flex-direction: column; height: 100%; box-sizing: border-box;
          padding: 6px 8px; position: relative; background: #fbfbfb; }
  .logoRow { height: 60px; display: flex; align-items: center; gap: 6px; }
  .newSession { height: 38px; border: 0; border-radius: 8px; background: #eee; margin-bottom: 8px; }
  .panelList { display: flex; flex-direction: column; gap: 2px; flex: none; margin-bottom: 8px; }
  .panelRow { display: flex; align-items: center; gap: 6px; min-height: 36px; border: 0;
              background: transparent; border-radius: 8px; padding: 7px 12px; text-align: left;
              font: inherit; color: #111; cursor: pointer; }
  .panelRow:hover { background: #ececec; }
  .panelGlyph { display: inline-flex; flex: none; }
  .panelTitle { white-space: nowrap; }
  .regionArea { flex: 1; min-height: 0; display: flex; flex-direction: column;
                overflow: hidden; margin-left: -4px; padding-left: 4px; }
  .sessionList { flex: 1; min-height: 0; overflow: auto; }
  .sessionRow { height: 32px; display: flex; align-items: center; padding: 0 8px;
                border-radius: 8px; color: #333; }
  .footArea { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }

  /* ---- DSH 设置弹窗骨架（复刻 dsh-client-ui-settings-general 的 grid 结构与遮罩层） ---- */
  .stOverlay { z-index: 1000; justify-content: center; align-items: center; display: flex;
               position: fixed; inset: 0; }
  .stMask { inset: 0; background: rgba(0,0,0,.28); position: absolute; }
  .stPanel { z-index: 1; width: 800px; height: min(800px, calc(100vh - 48px));
             border-radius: 12px; background: #fff; max-width: calc(100vw - 48px);
             box-shadow: 0 12px 40px rgba(0,0,0,.18);
             grid-template: "stTitle stHeader" "stNav stOptions" minmax(0,1fr) / 188px minmax(0,1fr);
             display: grid; position: relative; overflow: hidden; }
  .stNavTitle { grid-area: stTitle; padding: 22px 12px 8px 24px; font-size: 16px;
                font-weight: 500; line-height: 24px; }
  .stHeader { grid-area: stHeader; justify-content: space-between; align-items: flex-start;
              gap: 8px; height: 54px; padding: 20px 14px 8px 10px; display: flex;
              box-sizing: border-box; }
  .stClose { border-radius: 6px; cursor: pointer; width: 28px; height: 28px; background: 0 0;
             border: none; flex: none; display: inline-flex; justify-content: center;
             align-items: center; padding: 0; }
  .stNav { grid-area: stNav; padding: 0 8px 8px; }
  .stNavList { display: flex; flex-direction: column; gap: 2px; }
  .stNavCell { border: 0; background: transparent; border-radius: 8px; padding: 8px 12px;
               text-align: left; font: inherit; cursor: pointer; }
  .stNavCell[data-active="true"] { background: #ececec; }
  .stOptions { grid-area: stOptions; min-width: 0; min-height: 0; padding: 0 24px 24px;
               overflow-y: auto; }
</style>
</head>
<body>
<div id="col">
  <div id="root">
    <div class="logoRow">
      <span data-slot="sidebar.brand.mark"></span>
      <span data-slot="sidebar.brand.name">HARNESS</span>
    </div>
    <button class="newSession" type="button"><span class="newSessionContent">新会话</span></button>
    <nav class="panelList" aria-label="全局面板">
      <button class="panelRow" type="button" aria-label="插件">
        <span class="panelGlyph"><span data-slot="sidebar.panellist">&#9672;</span></span>
        <span class="panelTitle">插件</span>
      </button>
      <button class="panelRow" type="button" aria-label="自动化任务">
        <span class="panelGlyph"><span data-slot="sidebar.panellist">&#9783;</span></span>
        <span class="panelTitle">自动化任务</span>
      </button>
      <button class="panelRow" type="button" aria-label="技能中心">
        <span class="panelGlyph"><span data-slot="sidebar.panellist">&#10022;</span></span>
        <span class="panelTitle">技能中心</span>
      </button>
      <button class="panelRow" type="button" aria-label="客服">
        <span class="panelGlyph"><span data-slot="sidebar.panellist">&#9742;</span></span>
        <span class="panelTitle">客服</span>
      </button>
      <button class="panelRow" type="button" aria-label="MCP连接器">
        <span class="panelGlyph"><span data-slot="sidebar.panellist">&#9903;</span></span>
        <span class="panelTitle">MCP连接器</span>
      </button>
      <button class="panelRow" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
        <span class="panelGlyph"><span data-slot="sidebar.panellist">&#8943;</span></span>
        <span class="panelTitle">更多</span>
      </button>
    </nav>
    <div class="regionArea">
      <div class="sessionList" data-slot="sidebar.workspaces">
        <div class="sessionRow">会话一</div>
        <div class="sessionRow">会话二</div>
        <div class="sessionRow">会话三</div>
      </div>
    </div>
    <div class="footArea">
      <div data-slot="sidebar.settings"></div>
    </div>
  </div>
</div>

<script>
  // 最小 __ModuleLoader__ 桩：只捕获模块工厂，不参与 DSH 真实依赖解析。
  // 插件已拆成「内核 + 三个可选 chunk」，每个 chunk 都会走一次 load()，
  // 靠 registration.chunk 区分（与 DSH 的 chunkId(ownerId, fileName) 一致）。
  window.__moduleCapture = null;
  window.__moduleRegistry = {};
  window.__ModuleLoader__ = {
    load: function (mod) {
      if (!mod) return;
      var key = mod.chunk || "client.js";
      window.__moduleRegistry[key] = mod;
      if (mod.chunk === undefined) window.__moduleCapture = mod;
    }
  };
</script>
<script src="../client.js"></script>
<script src="../client.drag.js"></script>
<script src="../client.float.js"></script>
<script src="../client.settings.js"></script>
<script src="../client.window.js"></script>
<script>
  (function () {
    var mod = window.__moduleCapture;
    if (!mod) { document.title = "LOAD-FAIL"; return; }

    // 已物化的 chunk exports（对应 DSH 里 require.async 的缓存）
    var materialized = {};
    function materialize(key, ownerRequire) {
      if (materialized[key]) return materialized[key];
      var reg = window.__moduleRegistry[key];
      if (!reg) throw new Error("chunk not registered: " + key);
      materialized[key] = reg.factory(ownerRequire);
      return materialized[key];
    }

    // require 桩：既支持 DSH 的异步子模块（./client.X.js），
    // 其余裸模块名一律报错——回归台本来就不该依赖宿主服务。
    //
    // 例外是 "react"：功能开关区块挂在 SettingsSection 里，那一节要拿到
    // createElement 才会返回节点。这里给一个「直接建真实 DOM」的最小桩，
    // 只覆盖插件真正用到的形态（字符串/数字子节点、className、style、ref、
    // 以及其它一律 setAttribute 的属性）。它不是 React，也不做任何协调，
    // 只为了让 featuresView() 能被真实挂到页面上被测。
    function reactStub() {
      function applyProp(node, key, value) {
        if (value === null || value === undefined || value === false) return;
        if (key === "ref") return;
        if (key === "className") { node.className = String(value); return; }
        if (key === "style" && typeof value === "object") {
          Object.keys(value).forEach(function (k) {
            node.style.setProperty(k.replace(/[A-Z]/g, function (m) { return "-" + m.toLowerCase(); }), String(value[k]));
          });
          return;
        }
        if (key === "children") return;
        node.setAttribute(key, String(value));
      }
      function createElement(type, props) {
        if (typeof type === "function") {
          var fnProps = props || {};
          return type(fnProps);
        }
        var node = document.createElement(String(type));
        if (props) Object.keys(props).forEach(function (k) { applyProp(node, k, props[k]); });
        for (var i = 2; i < arguments.length; i++) {
          var child = arguments[i];
          if (child === null || child === undefined || child === false || child === true) continue;
          if (Array.isArray(child)) {
            child.forEach(function (c) {
              if (c === null || c === undefined || c === false || c === true) return;
              node.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
            });
            continue;
          }
          node.appendChild(typeof child === "object" ? child : document.createTextNode(String(child)));
        }
        if (props && typeof props.ref === "function") props.ref(node);
        return node;
      }
      return { createElement: createElement, Fragment: "div", createRef: function () { return { current: null }; } };
    }

    function makeRequire() {
      var req = function (name) {
        if (name === "react") return reactStub();
        if (name === "react-dom") return { createPortal: function (node) { return node; } };
        if (name === "react/jsx-runtime") return { jsx: function (t, p) { return { t: t, p: p }; }, jsxs: function (t, p) { return { t: t, p: p }; } };
        throw new Error("unexpected require: " + name);
      };
      req.async = function (spec) {
        var fileName = String(spec).replace(/^\.\//, "");
        return Promise.resolve().then(function () {
          return materialize(fileName, makeRequire());
        });
      };
      return req;
    }

    var exportsObj = mod.factory(makeRequire());
    // 桩 ctx：只提供插件真正会用到的面。slots.inject 只记录不回调，
    // 因此不需要 react，也不会渲染设置页。
    var injected = [];
    var registered = [];
    // 与 drag-harness 的唯一区别：把 inject 的回调与 register 的组件都留下来。
    // 功能开关区块挂在 SettingsSection 里，而 SettingsSection 只有通过
    // settings.section 这个注入点注册出去之后才拿得到，所以必须能手动调一次。
    var injectedCallbacks = {};
    var registeredComps = {};
    var fakeCtx = {
      get: function () { return null; },
      effect: function () { return function () {}; },
      logger: { warn: function () {} },
      slots: {
        inject: function (key, cb) { injected.push(key); injectedCallbacks[key] = cb; return function () {}; },
        register: function (opts, Comp) {
          var name = opts && opts.name;
          registered.push(name);
          if (name) registeredComps[name] = Comp;
          return function () {};
        },
        subscribe: function () { return function () {}; },
        entriesOfSlot: function () { return []; },
        getVersion: function () { return 0; }
      }
    };
    exportsObj.apply(fakeCtx);
    function navButtons() {
      return Array.from(document.querySelectorAll('[data-dsh-rail-part="nav"] > button'))
        .filter(function (b) {
          return !(b.getAttribute("aria-haspopup") === "menu" || b.hasAttribute("aria-expanded"));
        });
    }
    window.__HARNESS__ = {
      injected: injected,
      registered: registered,
      /** 三个可选模块是否都装配成功（探针据此判断降级路径有没有被误触发） */
      modulesReady: function () {
        return new Promise(function (resolve) {
          var tries = 0;
          (function poll() {
            var d = window.__DSH_RAIL__;
            var errs = (d && d.errors) || [];
            var faulted = 0;
            for (var i = 0; i < errs.length; i++) {
              if (String(errs[i]).indexOf("module ") === 0) faulted++;
            }
            if (faulted === 0 && document.querySelector('[data-dsh-rail-part="custom"] .dsr-float-toggle')) {
              resolve({ ready: true, faulted: 0 });
              return;
            }
            tries++;
            if (tries > 60) { resolve({ ready: false, faulted: faulted, errors: errs }); return; }
            setTimeout(poll, 25);
          })();
        });
      },
      labelsInDomOrder: function () {
        return navButtons().map(function (b) { return b.getAttribute("aria-label"); });
      },
      visualNavOrder: function () {
        return navButtons()
          .sort(function (a, b) { return a.getBoundingClientRect().top - b.getBoundingClientRect().top; })
          .map(function (b) { return b.getAttribute("aria-label"); });
      },
      visualEntryOrder: function () {
        return Array.from(document.querySelectorAll('[data-dsh-rail-part="custom"] .dsr-btn'))
          .filter(function (b) {
            return !b.classList.contains("dsr-toggle") && !b.classList.contains("dsr-float-toggle");
          })
          .sort(function (a, b) { return a.getBoundingClientRect().top - b.getBoundingClientRect().top; })
          .map(function (b) { return b.getAttribute("aria-label"); });
      },
      floatToggle: function () {
        return document.querySelector('[data-dsh-rail-part="custom"] .dsr-float-toggle');
      },
      grip: function () { return document.querySelector('[data-dsh-rail-grip]'); },
      root: function () { return document.querySelector('[data-dsh-rail-root]'); },
      navBox: function () { return document.querySelector('[data-dsh-rail-part="nav"]'); },
      regionBox: function () { return document.querySelector('[data-dsh-rail-part="region"]'); },

      /* ---- 设置弹窗骨架：open / close 模拟 DSH 的 React 挂载与卸载 ---- */
      openSettings: function () {
        if (document.querySelector('[data-shortcut-modal="settings"]')) return true;
        var overlay = document.createElement("div");
        overlay.className = "stOverlay";
        overlay.setAttribute("role", "presentation");
        var mask = document.createElement("div");
        mask.className = "stMask";
        mask.setAttribute("aria-hidden", "true");
        var panel = document.createElement("div");
        panel.className = "stPanel";
        panel.setAttribute("tabindex", "-1");
        panel.setAttribute("data-shortcut-modal", "settings");
        panel.setAttribute("role", "dialog");
        panel.setAttribute("aria-modal", "true");
        panel.innerHTML =
          '<div class="stNavTitle" tabindex="-1" data-modal-autofocus>设置</div>' +
          '<div class="stHeader"><div class="stActions"></div>' +
          '<button class="stClose" type="button" aria-label="关闭"><svg width="14" height="14">' +
          '<path d="M2 2l10 10M12 2L2 12" stroke="currentColor"/></svg>' +
          '<span class="hiddenLabel">关闭</span></button></div>' +
          '<nav class="stNav"><div class="stNavList">' +
          '<button class="stNavCell" type="button" data-active="true">通用</button>' +
          '<button class="stNavCell" type="button">侧边栏条目</button>' +
          '</div></nav>' +
          '<div class="stOptions"><p>设置内容区</p></div>';
        overlay.appendChild(mask);
        overlay.appendChild(panel);
        document.body.appendChild(overlay);
        window.__HARNESS__.notifyMount();
        return true;
      },
      closeSettings: function () {
        var p = document.querySelector('[data-shortcut-modal="settings"]');
        if (!p) return false;
        var overlay = p.parentElement;
        if (overlay) overlay.remove();
        window.__HARNESS__.notifyMount();
        return true;
      },
      settingsOpen: function () {
        return document.querySelector('[data-shortcut-modal="settings"]') !== null;
      },
      panel: function () { return document.querySelector('[data-shortcut-modal="settings"]'); },
      lights: function () { return document.querySelector('[data-dsh-rail-win-lights]'); },
      /* 内核诊断对象是现成暴露的，探针直接读它来判断模块状态与错误 */
      diag: function () { return window.__DSH_RAIL__ || null; },
      /* 回归台里设置弹窗是我们自己挂上去的（真实宿主里由官方 React 挂载），
         所以这里补一条「打开/关闭设置」的消息，等价官方挂载时的那一下通知。 */
      notifyMount: function () {
        document.dispatchEvent(new Event("dsh-settings-mount"));
      },

      /* ---- 功能开关：把 SettingsSection 真正渲染进设置弹窗的内容区 ----
         真实宿主里 DSH 的 slot 机制会调 settings.section 的注入回调去拿组件，
         再把这个组件当 React 组件渲染。回归台没有那套机制，所以这里手写等价的两步：
         ① 调一次注入回调 → 触发 ctx.slots.register(...)，组件落进 registeredComps；
         ② 取出组件当函数调用，把返回的真实 DOM 挂进 .stOptions。 */
      mountSection: function () {
        var cb = injectedCallbacks["settings.section"];
        if (typeof cb !== "function") return { ok: false, reason: "no-inject-callback" };
        if (!registeredComps["settings.section"]) {
          try { cb(); } catch (err) { return { ok: false, reason: "inject-threw: " + String(err) }; }
        }
        var Comp = registeredComps["settings.section"];
        if (typeof Comp !== "function") return { ok: false, reason: "no-component" };
        var host = document.querySelector(".stOptions");
        if (!host) return { ok: false, reason: "no-options-host" };
        var node = null;
        try { node = Comp({}); } catch (err) { return { ok: false, reason: "render-threw: " + String(err) }; }
        if (!node) return { ok: false, reason: "rendered-null" };
        host.appendChild(node);
        return { ok: true, html: host.innerHTML.length };
      },
      /* 四行开关的当前状态（顺序与 FEATURES 一致） */
      featureRows: function () {
        return Array.from(document.querySelectorAll(".dsr-switch")).map(function (row) {
          return {
            key: row.getAttribute("data-feature"),
            label: row.getAttribute("aria-label"),
            on: row.getAttribute("data-on") === "1",
            checked: row.getAttribute("aria-checked") === "true",
            desc: (row.querySelector(".dsr-switch-desc") || {}).textContent || ""
          };
        });
      },
      /* 点某一行的开关（等价用户点一下） */
      clickFeature: function (key) {
        var row = document.querySelector('.dsr-switch[data-feature="' + key + '"]');
        if (!row) return false;
        row.click();
        return true;
      },
      /* 读写功能开关。
         故意只走 UI：内核的 moduleApi 是闭包里的对象、没有挂到 window 上，
         探针不该为了图省事去反向依赖内部结构；用户能做的动作就是点这一下，
         所以「点一下 → 状态变化」本身就是被验的行为。 */
      setFeature: function (key, on) {
        var row = document.querySelector('.dsr-switch[data-feature="' + key + '"]');
        if (!row) return false;
        var want = on === true;
        var current = row.getAttribute("data-on") === "1";
        if (current === want) return true;
        row.click();
        return true;
      },
      getFeature: function (key) {
        var row = document.querySelector('.dsr-switch[data-feature="' + key + '"]');
        if (!row) return null;
        return row.getAttribute("data-on") === "1";
      },
      /* 存储层快照：验证持久化是否真的写进 localStorage */
      storedFeatures: function () {
        var raw = localStorage.getItem("dsh-sidebar-rail.features.v1");
        if (raw === null) return null;
        try { return JSON.parse(raw); } catch (err) { return { parseError: String(err) }; }
      }
    };
    // 点官方遮罩 = 关窗（DSH 的真实行为，回归台也要有）
    document.addEventListener("click", function (event) {
      if (event.target && event.target.classList && event.target.classList.contains("stMask")) {
        event.target.parentElement.remove();
      }
    });
  })();
</script>
</body>
</html>
